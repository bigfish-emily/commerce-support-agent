name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check app evaluation scripts tests benchmark_adapters

      - name: Pytest
        env:
          OPENAI_API_KEY: test-key
        run: uv run python -m pytest -q

      - name: Offline evals
        run: |
          uv run python -m evaluation.intent_eval
          uv run python -m evaluation.multi_intent_eval
          uv run python -m evaluation.task_eval
          uv run python -m evaluation.rag_retrieval_eval
          uv run python -m evaluation.knowledge_eval
          uv run python -m evaluation.ops_decision_eval
          uv run python -m evaluation.tool_repair_eval
          uv run python -m evaluation.trajectory_eval
          uv run python -m evaluation.route_drift_eval
          uv run python -m evaluation.agent_metrics_report

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  marketplace-agent:
    build: .
    depends_on:
      - redis
      - qdrant
    ports:
      - "8000:8000"
    environment:
      RUNTIME_STORE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      REDIS_PREFIX: olist-agent
      AGENT_RATE_LIMIT_PER_MINUTE: 120
      SUPPORT_VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: olist_support_examples
      # The guided demo has a local-only reviewer shortcut. Keep it closed in
      # the container profile; set DEMO_MODE=1 only for a disposable showcase.
      DEMO_MODE: ${DEMO_MODE:-0}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  redis-data:
  qdrant-data:

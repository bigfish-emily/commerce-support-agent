services:
  marketplace-agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./evaluation:/app/evaluation
      - ./scripts:/app/scripts
